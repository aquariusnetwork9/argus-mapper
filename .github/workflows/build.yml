name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: Core unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.1
      # --configure-on-demand: this is a single-Gradle-build repo covering
      # every Minecraft version's module, so a plain `gradle :core:test`
      # would still configure (and try to resolve Loom/Minecraft/Yarn
      # dependencies for) every other module first. Not needed to run
      # core's plain-Java tests, and it would let an unrelated module's
      # config break this job.
      - run: gradle --configure-on-demand :core:test
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core/build/reports/tests/test

  build-1-21-x:
    name: Build ${{ matrix.mcVersion }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 1.21.4 and 1.21.8 are legacy and out of band: not built, released, updated or supported.
      # Their folders stay in the repo as a record only. Do not add them back to this matrix.
      matrix:
        mcVersion: ['1.21.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.0
      - run: gradle --configure-on-demand ":${{ matrix.mcVersion }}:build"
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: argus-mapper-${{ matrix.mcVersion }}
          path: ${{ matrix.mcVersion }}/build/libs/*.jar

  build-26-2:
    name: Build 26.2
    runs-on: ubuntu-latest
    # Module renamed from 26.1 to 26.2 and ported for real (Xaero right-click integration,
    # region overlay, blackzones, upload tracking - all verified live) - see 26.2/NOTES.md.
    # Still continue-on-error while the actual upload/overlay flow isn't yet confirmed live
    # end-to-end (only the right-click menu and its labels are), so it can't block the 1.21.x
    # builds/release above if something in that unconfirmed path turns out broken.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - run: gradle --configure-on-demand ':26.2:build'
      - name: Upload mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: argus-mapper-26.2
          path: 26.2/build/libs/*.jar

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    # Only for an actual version tag (git tag vX.Y.Z && git push origin vX.Y.Z)
    # - a plain push to main builds and tests but never publishes a release.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core-tests, build-1-21-x, build-26-2]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # 25, not 21: this job now also builds :26.2:build, and fabric-loom 1.18.2 requires Java 25
      # to launch Gradle itself (not just as the module's own toolchain target) - confirmed live,
      # the same constraint hit locally all through the 26.2 port. The foojay-resolver-convention
      # plugin (settings.gradle) still auto-fetches whatever JDK :1.21.11:build's own toolchain
      # needs for compilation, so this doesn't affect that module.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.7.0
      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      # Rebuilt here (rather than reusing the matrix job's artifacts) so
      # every jar's own fabric.mod.json version matches the tag it ships
      # under, instead of the "unspecified" default from a plain build.
      #
      # 1.21.4 and 1.21.8 are legacy and are never part of a release (see build-1-21-x above).
      - name: Build 1.21.11 jar at release version
        run: gradle --configure-on-demand ':1.21.11:build' -Pversion=${{ steps.ver.outputs.version }}
      - name: Build 26.2 jar at release version
        continue-on-error: true
        run: gradle --configure-on-demand ':26.2:build' -Pversion=${{ steps.ver.outputs.version }}
      - name: Collect jars
        run: |
          mkdir -p dist
          cp 1.21.11/build/libs/*.jar dist/ 2>/dev/null || true
          cp 26.2/build/libs/*.jar dist/ 2>/dev/null || true
          ls -la dist
      - name: Refuse to publish an incomplete release
        run: |
          count=$(ls dist/*.jar 2>/dev/null | wc -l)
          if [ "$count" -lt 1 ]; then
            echo "::error::Expected at least the real 1.21.11 jar, found $count - not publishing a broken release."
            exit 1
          fi
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/*.jar \
            --title "ARGUS Mapper ${{ steps.ver.outputs.version }}" \
            --generate-notes
