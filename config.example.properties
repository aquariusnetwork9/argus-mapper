# Copy this to <minecraft config dir>/argus-mapper.properties and fill in
# your own token/layer (or use /argus settoken and /argus setlayer / /argus
# server use in-game instead). Never commit the real file - see README.md.
apiBaseUrl=https://map.argus.tools/api/partner/upload
token=
layer=
xaeroRootOverride=
includeCaves=false
# Nether region uploads only allowed near a known ARD highway - see README
# "Nether highway privacy gate". Fails closed (excludes) when unsure.
restrictNetherToHighways=true
# Uploads in flight at once (1-8). The next region starts as soon as the last one's
# file is sent; it doesn't wait for the server to finish with it.
uploadConcurrency=4
maxPerBatch=200
maxFileSizeBytes=10000000
maxRetries=3
# Include regions whose Xaero file is newer than when they were last uploaded in
# the next upload run, instead of skipping them forever. The API replaces the
# older copy with the new one. Off by default (opt-in). See README "Re-uploading
# regions that changed".
reuploadChangedRegions=false
# Auto-map (the flight autopilot for a box you pick on Xaero's map). Speeds are
# Meteor Elytra Fly's units, blocks per tick (20 per second: 1.25 = 25 blocks/s).
# It picks the speed that maps the most ground per second from the width table
# (speed:chunks-across pairs; blank = the built-in 6b6t measurements: 14 across
# at 25 blocks/s, 6 at 40, 4 at 60, 2 at 92), within the min and max below.
# autoMapSpeed pins the speed instead (0 = pick). autoMapHalfWidthChunks pins how
# many chunks either side of the flight line count as mapped (0 = from the table).
autoMapMinSpeed=1.0
autoMapMaxSpeed=5.99
autoMapSpeed=0
autoMapWidthTable=
# Well above build height (320), clear of builds and withers up there.
autoMapCruiseY=475
autoMapHalfWidthChunks=0
# Lets other Fabric mods listen to this mod's upload/stats events. See README
# "Add-on API".
enableAddonApi=true

# Discord webhook reporting (leaderboard / distance / chunks-contributed).
# Create a webhook URL from a Discord channel's Integrations settings.
discordWebhookUrl=
autoReportToDiscord=false

# Rich Presence is NOT implemented yet - see README. Reserved so a future
# build can add it without another config migration.
discordApplicationId=
enableRichPresence=false
