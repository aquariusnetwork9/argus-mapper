plugins {
    id 'fabric-loom' version '1.17.20'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('core/src/main/java')
            srcDir rootProject.file('fabric-common/src/main/java')
            // Aquarius Road Department (ARD) - see ard-common/README via the project root README
            // "Design" section. ard-src holds this version's own fork of the 2 files with real
            // API differences across 1.21.4/1.21.8/1.21.11 (HUD registration, session service,
            // ClickEvent shape) - see each fork's javadoc.
            srcDir rootProject.file('ard-common/src/main/java')
            srcDir rootProject.file('1.21.11/ard-src')
            // The GUI (/argus gui) doesn't compile as-is on this version - PressableWidget's
            // onPress/renderWidget/drawIcon signatures changed here, and KeyBinding's category
            // parameter became a record instead of a String. ArgusGuiScreen and its widgets are
            // excluded outright (not ported); GuiLauncher gets a no-op replacement from gui-src
            // below instead of an exclude, since fabric-common's ArgusCommand/ArgusUploaderClientMod
            // still need *a* GuiLauncher class to compile against - see its own javadoc.
            srcDir rootProject.file('1.21.11/gui-src')
            exclude 'tools/argus/uploader/fabric/gui/ArgusGuiScreen.java'
            exclude 'tools/argus/uploader/fabric/gui/PanelButton.java'
            exclude 'tools/argus/uploader/fabric/gui/ToggleButton.java'
            exclude 'tools/argus/uploader/fabric/gui/LabeledSlider.java'
            exclude 'tools/argus/uploader/fabric/gui/GuiLauncher.java'
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.5"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
