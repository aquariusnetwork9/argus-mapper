plugins {
    id 'fabric-loom' version '1.17.20'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDir rootProject.file('core/src/main/java')
            srcDir rootProject.file('fabric-common/src/main/java')
            // Aquarius Road Department (ARD) - see ard-common/README via the project root README
            // "Design" section. ard-src holds this version's own fork of the 2 files with real
            // API differences across 1.21.4/1.21.8/1.21.11 (HUD registration, session service,
            // ClickEvent shape) - see each fork's javadoc.
            srcDir rootProject.file('ard-common/src/main/java')
            srcDir rootProject.file('1.21.11/ard-src')
            // The GUI (/argus gui) is ported here via gui-src, verified against the real 1.21.11
            // Yarn mappings (net.fabricmc:yarn:1.21.11+build.6:v2), not guessed. PressableWidget's
            // onPress()/renderWidget(...) became onPress(AbstractInput)/drawButton(DrawContext) -
            // see gui-src/PanelButton.java's javadoc - and KeyBinding's category parameter became
            // a KeyBinding.Category, not a String - see gui-src/GuiLauncher.java. ArgusGuiScreen
            // and ToggleButton are straight copies/trivial updates on top of that (see their own
            // gui-src javadocs); LabeledSlider (SliderWidget) is untouched between versions, so
            // fabric-common's copy of just that one file is still used directly, not excluded.
            srcDir rootProject.file('1.21.11/gui-src')
            exclude 'tools/argus/uploader/fabric/gui/ArgusGuiScreen.java'
            exclude 'tools/argus/uploader/fabric/gui/PanelButton.java'
            exclude 'tools/argus/uploader/fabric/gui/ToggleButton.java'
            exclude 'tools/argus/uploader/fabric/gui/GuiLauncher.java'
        }
    }
}

repositories {
    mavenCentral()
    // Xaero's World Map isn't published to Maven Central - Modrinth mirrors mod jars as Maven
    // artifacts under the maven.modrinth group (same source XaeroPlus itself builds against).
    // Content-filtered so it's only ever consulted for that one group.
    maven {
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:1.21.11"
    mappings "net.fabricmc:yarn:1.21.11+build.6:v2"
    modImplementation "net.fabricmc:fabric-loader:0.19.5"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11"
    // compileOnly, not implementation: the blackzone map-select mixin (see gui-src/mixin/xaero)
    // is optional compat, not a hard requirement - ArgusXaeroMixinPlugin gates it on
    // FabricLoader.isModLoaded("xaeroworldmap") so the rest of the mod works fine without Xaero's
    // World Map installed. transitive = false to match how XaeroPlus itself depends on this.
    modCompileOnly('maven.modrinth:xaeros-world-map:fabric-1.21.11-1.46.0') { transitive = false }
}

processResources {
    inputs.property 'version', project.version
    filteringCharset 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}
