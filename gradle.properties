# Shared project version for every subproject - each module's build.gradle
# expands it into fabric.mod.json's "version" field via processResources.
# A tagged release build overrides this with -Pversion=<tag without the v>
# (see .github/workflows/build.yml's release job) so a jar's own metadata
# always matches the GitHub Release it shipped in.
version=0.4.1
